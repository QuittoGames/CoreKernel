name: CoreKernel Build & Release

on:
  push:
    branches: [ "main" ]
  pull_request:

# Permissão obrigatória para que o bot do GitHub Actions possa criar Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            gcc-multilib \
            g++-multilib \
            nasm \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools

      - name: Fix grub command for Ubuntu
        run: |
          # Cria um alias global para que o Ubuntu entenda 'grub2-mkrescue'
          sudo ln -s /usr/bin/grub-mkrescue /usr/local/bin/grub2-mkrescue

      - name: Make scripts executable
        run: |
          chmod +x tools/build.sh
          chmod +x tools/run.sh

      - name: Build Kernel ISO
        run: |
          ./tools/build.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: corekernel-iso
          path: build/kernel.iso

      - name: Create GitHub Release
        # Gera a release automaticamente APENAS quando o push for na branch main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: "CoreKernel Build (${{ github.sha }})"
          body: "Build gerada automaticamente a partir do commit principal."
          files: build/kernel.iso
